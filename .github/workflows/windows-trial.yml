name: Windows local trial acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packaged-runtime:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Prepare exact Windows dependencies
        shell: pwsh
        run: |
          python -m pip install packaging
          python packaging/windows/fetch_inputs.py
          Copy-Item packaging/windows/requirements.lock .local/windows-build/requirements.lock
          python -m pip download --index-url https://pypi.org/simple --platform win_amd64 --python-version 313 --implementation cp --only-binary=:all: --no-deps --require-hashes -r packaging/windows/requirements.lock --dest .local/windows-build/wheels
      - name: Build allowlisted portable trial
        run: python -m scripts.build_windows_bundle
      - name: Test packaged Python, PostgreSQL, login, backup and shutdown
        shell: pwsh
        run: |
          $bundle = (Resolve-Path '.local/releases/UnionBakery-Windows-x64-Trial-2026.11.19').Path
          $env:WINDOWS_BUNDLE_TEST_ROOT = $bundle
          $env:PG_BIN = Join-Path $bundle 'runtime/postgres/bin'
          & (Join-Path $bundle 'runtime/python/python.exe') -X utf8 (Join-Path $bundle 'preflight.py')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $bundle 'runtime/python/python.exe') -X utf8 tests/test_windows_local.py
          exit $LASTEXITCODE
